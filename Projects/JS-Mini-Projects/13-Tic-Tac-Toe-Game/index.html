<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <div class="container">
        <h1><span>Tic</span> <span>Tac</span> <span>Toe</span></h1>
        <p>Play with your friends and win the game</p>

        <div id="board">
            <button id="0"></button>
            <button id="1"></button>
            <button id="2"></button>
            <button id="3"></button>
            <button id="4"></button>
            <button id="5"></button>
            <button id="6"></button>
            <button id="7"></button>
            <button id="8"></button>
        </div>
        <h2 id="status">🏆 Player X's turn</h2>
        <button id="resetBtn"> <i class="ri-reset-right-line"></i> Reset Game</button>

    </div>
    <script src="./script.js"></script>
</body>

</html>
