<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Background Color Changer</h1>
    <p>Click on any color button to change the background</p>

    <div class="card">
        <h2>Choose a Color</h2>
        <div id="buttons">
            <button id="#D91A2A" class="red">Red</button>
            <button id="#FFA200" class="yellow">Yellow</button>
            <button id="#008CF0" class="blue">Blue</button>
            <button id="#47DB42" class="green">Green</button>
            <button id="#EB63B6" class="pink">Pink</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
